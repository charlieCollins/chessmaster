# CI on every PR to main; on merge (push to main) also deploy to chess.azimondia.com.
# Deploy = test → build frontend → ssh to the VM with a deploy key that can only run
# deploy/ci/ssh-command.sh (see deploy/ci/setup-vm.sh) → check Cloudflare Access still
# demands a login, else take the site down again.
#
# Secrets: DEPLOY_SSH_KEY (private key), DEPLOY_HOST (VM IP), DEPLOY_KNOWN_HOSTS (pinned host key).
name: CI / Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:        # manual re-deploy of main from the Actions tab

concurrency:
  # PRs: newest push wins. main: deploys run one at a time, in order.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Stockfish
        run: sudo apt-get update -qq && sudo apt-get install -y -qq stockfish
      - run: pip install -q -r requirements-dev.txt
      - name: Backend tests
        run: pytest -q
        env:
          STOCKFISH_PATH: /usr/games/stockfish

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests, lint, build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx eslint src
          npm run build

      - name: Keep the frontend build for the deploy
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 7

  deploy:
    name: Deploy to chess.azimondia.com
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          tar -czf dist.tgz dist
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "chess-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA" < dist.tgz

      - name: Cloudflare Access must still require a login
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://chess.azimondia.com/api/engines || true)
          echo "anonymous /api/engines → HTTP $code"
          if [ "$code" = "200" ]; then
            ssh -i ~/.ssh/deploy_key -o BatchMode=yes "chess-deploy@$DEPLOY_HOST" disable-site
            echo "::error::chess.azimondia.com answered without a Cloudflare Access login — site disabled again"
            exit 1
          fi

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
